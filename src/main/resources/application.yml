spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa

  h2:
    console:
      enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}   # 키를 파일에 직접 쓰지 말고 환경변수로
      chat:
        options:
          model: gpt-5-nano
      image:
        options:
          model: gpt-image-2
          quality: low
          size: 1024x1024